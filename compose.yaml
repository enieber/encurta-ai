services:
  database:
    container_name: encurta-ai_db
    image: postgres:17.5
    restart: always
    environment:
      - POSTGRES_USER=user
      - POSTGRES_DB=db
      - POSTGRES_PASSWORD=pass
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    networks:
      - database
    healthcheck:
      test: "CMD-SHELL pg_isready -U user -d db"
      interval: 5s
      timeout: 5s
      start_period: 30s  
  app:
    container_name: encurta-ai_app
    image: ghcr.io/enieber/encurta-ai:latest
    build:
      dockerfile: dockerfile
      context: .
    ports:
      - 5150:5150
    environment:
      - ENV=$ENV
      - DATABASE_URL=$DATABASE_URL
      - SMTP_HOST=$SMTP_HOST
      - SMTP_PORT=$SMTP_PORT
      - SMTP_USER=$SMTP_USER
      - SMTP_PASSWORD=$SMTP_PASSWORD
      - SMTP_SENDER=$SMTP_SENDER
    networks:
      - database
      - app

volumes:
  postgres-data:

networks:
  app:
    name: app
  database:
    driver: bridge

